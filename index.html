<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NotURL - Fast & Secure URL Shortener</title>
    <meta
      name="description"
      content="NotURL is a free URL shortener with analytics. Shorten links, track clicks, and manage URLs easily."
    />
    <meta
      name="keywords"
      content="url shortener, link shortener, shorten url, noturl, track clicks, link analytics, free url shortener"
    />
    <meta name="author" content="NotURL" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://noturl.in" />
    <meta property="og:title" content="NotURL - Smart Link Shortener" />
    <meta
      property="og:description"
      content="NotURL is a free URL shortener with analytics. Shorten links, track clicks, and manage URLs easily."
    />
    <meta property="og:url" content="https://noturl.in" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NotURL" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NotURL - Fast & Secure URL Shortener" />
    <meta
      name="twitter:description"
      content="NotURL is a free URL shortener with analytics. Shorten links, track clicks, and manage URLs easily."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NotURL",
        "url": "https://noturl.in"
      }
    </script>
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem("theme");
          var theme = savedTheme || "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
